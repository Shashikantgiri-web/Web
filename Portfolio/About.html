<!doctype html>

        main {

            background-image: url("images/2.bg.png");
            object-fit: cover;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>
    <header class="d-flex flex-wrap justify-content-center px-4 py-3 mb-4 fixed-top text-danger-emphasis">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <svg class="bi me-2" width="40" height="32" aria-hidden="true">
                <use xlink:href="#bootstrap"></use>
            </svg> <span class="fs-4 fw-bold fst-italic">Portfolio</span>
        </a>
        <ul class="nav nav-pills">
            <li class="nav-item"><a href="#" class="nav-link text-secondary-emphasis btn btn-outline-light">Home</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-secondary-emphasis btn btn-outline-light">About</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-secondary-emphasis btn btn-outline-light">Skills</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-secondary-emphasis btn btn-outline-light">Projects</a></li>

            <div class="d-flex flex-row justify-content-center py-3 g-1">
                <button class="btn btn-primary mx-2">View Projects</button>
                <button class="btn btn-primary mx-2">Contact Me</button>
            </div>
            <div class="d-flex flex-row justify-content-center py-3 g-2">

        <div class="d-flex flex justify-content-center align-items-center py-3 mb-4 w-50">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
